<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart-Fix-Guide | แหล่งความรู้และซ่อมสมาร์ทโฟน</title>
    <meta name="description" content="คู่มือแก้ปัญหา การดูแลสมาร์ทโฟน iOS และ Android และการเปลี่ยนอะไหล่พื้นฐาน">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <div class="container nav-content">
            <a href="#" onclick="closeReader()" class="logo">Smart-Fix-Guide</a>
            <div>
                <button onclick="setLang('th')" style="border:none; background:none; cursor:pointer;">TH</button> | 
                <button onclick="setLang('en')" style="border:none; background:none; cursor:pointer;">EN</button>
            </div>
        </div>
    </header>

    <!-- LANDING VIEW -->
    <div id="landing-view">
        <section class="hero">
            <h1 data-i18n="heroTitle">คู่มือแก้ปัญหา & ซ่อมสมาร์ทโฟน</h1>
            <p data-i18n="heroSub" style="margin-top: 10px;">เทคนิคการใช้งานและการดูแลมือถือ iOS และ Android</p>
            <div class="search-bar">
                <input type="text" data-i18n-placeholder="searchPlace">
                <button>🔍</button>
            </div>
        </section>
        
        <div class="container">
            <!-- Ad Slot A -->
            <div class="ad-slot">[ ADS: Top Leaderboard 728x90 ]</div>

            <div class="filters">
                <button class="filter-btn active" onclick="filterCategory('all')" data-i18n="navAll">ทั้งหมด</button>
                <button class="filter-btn" onclick="filterCategory('ios')" data-i18n="navIOS">🍎 iOS</button>
                <button class="filter-btn" onclick="filterCategory('android')" data-i18n="navAndroid">🤖 Android</button>
                <button class="filter-btn" onclick="filterCategory('diy')" data-i18n="navDIY">🔋 ฮาร์ดแวร์ & อะไหล่</button>
            </div>

            <div class="grid" id="article-grid">
                <!-- Articles will be rendered here via JS -->
            </div>
        </div>
    </div>

    <!-- READER VIEW -->
    <div id="reader-view">
        <div class="container">
            <div class="reader-header">
                <button onclick="closeReader()" style="border:none; background:none; color:var(--primary); cursor:pointer; font-size:1.1rem; margin-bottom:20px;" data-i18n="backBtn">← กลับหน้าหลัก</button>
                <h1 id="reader-title" style="margin-bottom: 20px; font-size: 2rem;">Title</h1>
            </div>
            
            <!-- Ad Slot C -->
            <div class="ad-slot" style="max-width:800px; margin: 0 auto 20px;">[ ADS: Before Article ]</div>
            
            <img id="reader-cover" class="reader-cover" src="" alt="Cover Image">
            <div id="reader-body" class="reader-content">
                <!-- Content here -->
            </div>
            
            <!-- Affiliate / Shop CTA -->
            <div class="reader-content">
                <div class="shop-cta" id="reader-shop">
                    <div>
                        <h3 style="color:var(--accent);">แนะนำสำหรับคุณ</h3>
                        <p>อะไหล่มาตรฐานและอุปกรณ์สำหรับบทความนี้</p>
                    </div>
                    <a href="#" id="shop-link" class="btn-primary" target="_blank" data-i18n="shopBtn">🛒 สั่งซื้ออะไหล่มาตรฐาน</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/posts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
